<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACK THE BOX — לוח בקרה</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');
:root {
  --bg:#0e0d0b; --bg2:#1e1c18; --text:#e8e3da; --mid:#9a9088;
  --border:rgba(232,227,218,0.18); --green:#5a8a4a; --red:#c43000;
  --gold:#a89060; --accent:#e8e3da;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;padding:0;}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:100;}

/* ── LOGIN ── */
#login-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:var(--bg);z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:30px;
}
.login-title{font-family:'Rajdhani',sans-serif;font-size:clamp(24px,6vw,42px);letter-spacing:8px;color:var(--accent);}
.login-sub{font-size:10px;letter-spacing:5px;color:var(--mid);}
.login-line{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
#admin-pass{
  background:rgba(232,227,218,0.07);border:1px solid var(--border);
  color:var(--text);font-family:'Share Tech Mono',monospace;
  font-size:16px;letter-spacing:6px;padding:12px 20px;
  text-align:center;outline:none;width:min(260px,85%);
  text-transform:uppercase;
}
#admin-pass:focus{border-color:var(--accent);}
#login-btn{
  background:var(--accent);color:var(--bg);border:none;
  padding:11px 36px;font-family:'Share Tech Mono',monospace;
  font-size:13px;letter-spacing:4px;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
#login-err{color:var(--red);font-size:11px;letter-spacing:3px;min-height:16px;}

/* ── MAIN LAYOUT ── */
#main{display:none;flex-direction:column;min-height:100vh;}

header{
  background:rgba(14,13,11,0.9);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;backdrop-filter:blur(4px);
}
.header-title{font-family:'Rajdhani',sans-serif;font-size:clamp(16px,4vw,24px);letter-spacing:5px;}
.header-sub{font-size:9px;letter-spacing:4px;color:var(--mid);}
#live-indicator{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:3px;color:var(--green);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse-dot 1.5s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.3;}}

.content{padding:16px;max-width:1200px;margin:0 auto;width:100%;}

/* ── STATS BAR ── */
.stats-bar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;margin-bottom:20px;
}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  padding:14px 16px;text-align:center;
}
.stat-num{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;color:var(--accent);}
.stat-lbl{font-size:9px;letter-spacing:3px;color:var(--mid);margin-top:2px;}

/* ── SECTION TITLE ── */
.section-title{
  font-size:10px;letter-spacing:5px;color:var(--mid);
  margin:20px 0 10px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-size:11px;}
.data-table th{
  text-align:right;padding:8px 12px;
  font-size:9px;letter-spacing:3px;color:var(--mid);
  border-bottom:1px solid var(--border);
  background:rgba(232,227,218,0.04);
}
.data-table td{
  padding:10px 12px;border-bottom:1px solid rgba(232,227,218,0.06);
  vertical-align:top;
}
.data-table tr:hover td{background:rgba(232,227,218,0.03);}
.player-name{color:var(--accent);font-size:13px;font-family:'Rajdhani',sans-serif;letter-spacing:2px;}
.box-badge{
  display:inline-block;background:rgba(232,227,218,0.08);
  border:1px solid var(--border);padding:2px 8px;
  font-size:10px;letter-spacing:2px;margin:2px;
}
.time-ago{font-size:10px;color:var(--mid);}
.code-badge{
  display:inline-block;padding:2px 8px;border-radius:2px;
  font-size:10px;letter-spacing:2px;margin:2px;
}
.code-T{background:rgba(90,138,74,0.15);border:1px solid rgba(90,138,74,0.4);color:#7ab86a;}
.code-W{background:rgba(168,144,96,0.15);border:1px solid rgba(168,144,96,0.4);color:var(--gold);}
.code-L{background:rgba(74,100,138,0.15);border:1px solid rgba(74,100,138,0.4);color:#7a9ac8;}
.code-E{background:rgba(138,74,74,0.15);border:1px solid rgba(138,74,74,0.4);color:#c88a8a;}

/* ── ACTIONS ── */
.action-btn{
  background:none;border:1px solid var(--border);color:var(--mid);
  padding:5px 12px;font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:2px;cursor:pointer;transition:all .2s;
}
.action-btn:hover{border-color:var(--red);color:var(--red);}
.action-btn.ok:hover{border-color:var(--green);color:var(--green);}

/* ── RESET PANEL ── */
.reset-panel{
  background:var(--bg2);border:1px solid var(--border);
  padding:16px;margin-top:20px;
}
.reset-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.reset-input{
  background:rgba(232,227,218,0.07);border:1px solid var(--border);
  color:var(--text);font-family:'Share Tech Mono',monospace;
  font-size:14px;letter-spacing:4px;padding:8px 14px;
  text-transform:uppercase;outline:none;flex:1;min-width:140px;
  text-align:center;
}
.reset-input:focus{border-color:var(--accent);}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:30px;color:var(--mid);font-size:11px;letter-spacing:3px;}

/* ── GAME ICONS ── */
.game-icon{font-size:14px;margin-left:6px;}

/* scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);}

.blink{animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-sub">HACK THE BOX</div>
  <div class="login-line"></div>
  <div class="login-title">לוח בקרה</div>
  <div class="login-sub">[ גישת מנהל בלבד ]</div>
  <input id="admin-pass" type="password" placeholder="סיסמה" autocomplete="off"/>
  <div id="login-err"></div>
  <button id="login-btn">כניסה</button>
</div>

<!-- MAIN DASHBOARD -->
<div id="main">
  <header>
    <div>
      <div class="header-title">ADMIN PANEL</div>
      <div class="header-sub">HACK THE BOX — לוח בקרה</div>
    </div>
    <div id="live-indicator">
      <div class="live-dot"></div>
      <span>חי</span>
    </div>
  </header>

  <div class="content">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-num" id="stat-players">0</div><div class="stat-lbl">שחקנים</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-wins">0</div><div class="stat-lbl">תיבות שנפתחו</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-codes">0</div><div class="stat-lbl">קודי עזרה שומשו</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-active">0</div><div class="stat-lbl">פעילים (5 דקות)</div></div>
    </div>

    <!-- Players table -->
    <div class="section-title">שחקנים ופעילות</div>
    <table class="data-table" id="players-table">
      <thead>
        <tr>
          <th>שם</th>
          <th>תיבה</th>
          <th>סטטוס</th>
          <th>קודי עזרה</th>
          <th>זמן אחרון</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="players-body">
        <tr><td colspan="6" class="empty">ממתין לשחקנים...</td></tr>
      </tbody>
    </table>

    <!-- Help codes used -->
    <div class="section-title">שימוש בקודי עזרה</div>
    <table class="data-table" id="codes-table">
      <thead>
        <tr>
          <th>שחקן</th>
          <th>קוד</th>
          <th>סוג</th>
          <th>תיבה</th>
          <th>שעה</th>
          <th>איפוס</th>
        </tr>
      </thead>
      <tbody id="codes-body">
        <tr><td colspan="6" class="empty">אין שימוש בקודים עדיין</td></tr>
      </tbody>
    </table>

    <!-- Reset panel -->
    <div class="section-title">איפוס קודים</div>
    <div class="reset-panel">
      <div class="reset-row">
        <input class="reset-input" id="reset-code-input" placeholder="קוד לאיפוס (XXXXXX)"/>
        <button class="action-btn ok" onclick="resetSpecificCode()">אפס קוד</button>
      </div>
      <div class="reset-row">
        <input class="reset-input" id="reset-player-input" placeholder="שם שחקן"/>
        <button class="action-btn ok" onclick="resetPlayerCodes()">אפס כל קודי שחקן</button>
      </div>
      <div class="reset-row">
        <button class="action-btn" onclick="resetAllCodes()" style="color:var(--red);border-color:rgba(196,48,0,0.4)">⚠ אפס את כל הקודים</button>
        <button class="action-btn ok" onclick="refreshData()" style="margin-right:auto">רענן נתונים</button>
      </div>
      <div id="reset-msg" style="font-size:10px;letter-spacing:3px;min-height:16px;color:var(--green);"></div>
    </div>

  </div>
</div>

<script>
const ADMIN_PASSWORD = 'npc2024';
const FB_URL = 'https://hack-the-box-larp-default-rtdb.europe-west1.firebasedatabase.app';

function fbGet(path) {
  return fetch(`${FB_URL}/${path}.json`).then(r=>r.json()).catch(()=>null);
}
function fbDelete(path) {
  return fetch(`${FB_URL}/${path}.json`,{method:'DELETE'}).catch(()=>{});
}

const EFFECT_NAMES = { T:'⏱ זמן', W:'✓ פתרון', L:'💡 עזרה', E:'↓ הקלה' };
const GAME_ICONS   = { shooter:'🔫', sequence:'🧠', blocks:'🧩' };

let playersData = {}, codesData = {};

// ── LOGIN ──────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('admin-pass').addEventListener('keydown', e=>{if(e.key==='Enter')login();});

function login() {
  const pass = document.getElementById('admin-pass').value.trim();
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    startPolling();
  } else {
    document.getElementById('login-err').textContent = 'סיסמה שגויה';
    document.getElementById('admin-pass').value = '';
  }
}

// ── POLLING (every 5s) ─────────────────────────────────
function startPolling() {
  refreshData();
  setInterval(refreshData, 5000);
}

async function refreshData() {
  const [players, codes] = await Promise.all([
    fbGet('players'),
    fbGet('helpCodes')
  ]);
  playersData = players || {};
  codesData   = codes   || {};
  renderAll();
  document.getElementById('live-indicator').innerHTML =
    '<div class="live-dot"></div><span>עודכן ' + new Date().toLocaleTimeString('he-IL') + '</span>';
}

// ── RENDER ─────────────────────────────────────────────
function renderAll() {
  renderStats();
  renderPlayers();
  renderCodes();
}

function timeAgo(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'עכשיו';
  if (diff < 3600000) return Math.floor(diff/60000) + ' דק\'';
  return Math.floor(diff/3600000) + ' שע\'';
}

function renderStats() {
  const players = Object.values(playersData);
  document.getElementById('stat-players').textContent = players.length;
  document.getElementById('stat-wins').textContent    = players.filter(p=>p.won).length;
  document.getElementById('stat-codes').textContent   = Object.keys(codesData).length;
  document.getElementById('stat-active').textContent  = players.filter(p=>p.lastSeen&&Date.now()-p.lastSeen<300000).length;
}

function renderPlayers() {
  const tbody = document.getElementById('players-body');
  const players = Object.entries(playersData);
  if (!players.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">ממתין לשחקנים...</td></tr>';
    return;
  }
  players.sort((a,b)=>(b[1].lastSeen||0)-(a[1].lastSeen||0));
  tbody.innerHTML = players.map(([key,p]) => {
    const icon = GAME_ICONS[p.game]||'❓';
    const status = p.won
      ? '<span style="color:var(--green)">✓ פתח</span>'
      : '<span style="color:var(--mid)">⏳ משחק</span>';
    const usedCodes = Object.entries(codesData)
      .filter(([,cd])=>cd.player===p.name)
      .map(([code])=>`<span class="code-badge code-${code[0]}">${EFFECT_NAMES[code[0]]||code[0]}</span>`)
      .join('') || '—';
    return `<tr>
      <td><div class="player-name">${p.name||'—'}</div></td>
      <td><span class="box-badge">${icon} ${p.boxId||'?'}</span> <span style="font-size:10px;color:var(--mid)">${p.boxTitle||''}</span></td>
      <td>${status}</td>
      <td>${usedCodes}</td>
      <td class="time-ago">${timeAgo(p.lastSeen)}</td>
      <td><button class="action-btn" onclick="removePlayer('${key}')">הסר</button></td>
    </tr>`;
  }).join('');
}

function renderCodes() {
  const tbody = document.getElementById('codes-body');
  const codes = Object.entries(codesData);
  if (!codes.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">אין שימוש בקודים עדיין</td></tr>';
    return;
  }
  codes.sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  tbody.innerHTML = codes.map(([code,cd]) => {
    const type = code[0];
    return `<tr>
      <td class="player-name">${cd.player||'—'}</td>
      <td style="letter-spacing:4px">${code}</td>
      <td><span class="code-badge code-${type}">${EFFECT_NAMES[type]||type}</span></td>
      <td><span class="box-badge">${cd.boxId||'?'}</span></td>
      <td class="time-ago">${timeAgo(cd.ts)}</td>
      <td><button class="action-btn ok" onclick="resetCode('${code}')">אפס</button></td>
    </tr>`;
  }).join('');
}

// ── ACTIONS ────────────────────────────────────────────
function showMsg(text, isOk=true) {
  const el = document.getElementById('reset-msg');
  el.textContent = text;
  el.style.color = isOk ? 'var(--green)' : 'var(--red)';
  setTimeout(()=>el.textContent='', 2500);
}

async function resetCode(code) {
  await fbDelete(`helpCodes/${code}`);
  showMsg(`קוד ${code} אופס`);
  refreshData();
}

async function removePlayer(key) {
  await fbDelete(`players/${key}`);
  showMsg('שחקן הוסר');
  refreshData();
}

window.resetCode = resetCode;
window.removePlayer = removePlayer;

window.resetSpecificCode = async () => {
  const code = document.getElementById('reset-code-input').value.trim().toUpperCase();
  if (!code) return;
  await fbDelete(`helpCodes/${code}`);
  document.getElementById('reset-code-input').value = '';
  showMsg(`קוד ${code} אופס`);
  refreshData();
};

window.resetPlayerCodes = async () => {
  const name = document.getElementById('reset-player-input').value.trim();
  if (!name) return;
  let count = 0;
  for (const [code,cd] of Object.entries(codesData)) {
    if (cd.player && cd.player.includes(name)) {
      await fbDelete(`helpCodes/${code}`);
      count++;
    }
  }
  document.getElementById('reset-player-input').value = '';
  showMsg(`אופסו ${count} קודים של ${name}`);
  refreshData();
};

window.resetAllCodes = async () => {
  if (!confirm('לאפס את כל קודי העזרה?')) return;
  await fbDelete('helpCodes');
  showMsg('כל הקודים אופסו');
  refreshData();
};

window.refreshData = refreshData;

</script>
</body>
</html>
