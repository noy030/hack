<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoRHa — Connecting...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  body {
    margin: 0; background: #080806; color: #c8c2b5;
    font-family: 'Share Tech Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; flex-direction: column; gap: 16px;
  }
  .dot { animation: blink 0.6s step-end infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 50% { opacity: 0; } }
  #status { font-size: 12px; letter-spacing: 4px; color: #6a6458; margin-top: 8px; }
  #err { color: #cc3300; font-size: 13px; letter-spacing: 3px; display:none; text-align:center; line-height:2; }
</style>
</head>
<body>
<div style="font-size:22px;letter-spacing:6px;">
  CONNECTING<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
</div>
<div id="status">INITIALIZING TACTICAL LINK</div>
<div id="err">
  BOX NOT FOUND<br>
  <span style="font-size:11px;color:#6a6458">CHECK QR CODE AND TRY AGAIN</span>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  ▼▼▼  הגדרות התיבות — עריכה כאן בלבד  ▼▼▼
// ═══════════════════════════════════════════════════════
//
//  game:   'shooter'  /  'sequence'  /  'nodes'
//  code:    הקוד שהשחקן יראה בסוף
//  title:   שם התיבה (מוצג במשחק)
//  diff:    1=קל  2=בינוני  3=קשה
//
//  הגדרות מתקדמות לפי סוג משחק:
//  --- shooter ---
//    coreHp    כמות ה-HP של הגרעין
//    walls     כמות חומות סביב הגרעין
//    time      זמן בשניות
//
//  --- sequence ---
//    sequences   כמה רצפים לעבור
//    baseLen     אורך רצף התחלתי
//    timePerSeq  זמן לכל רצף
//
//  --- nodes ---
//    puzzles   כמה פאזלים לעבור (1-3)
//    time      זמן לכל פאזל

const BOXES = {
  // ── קל ──────────────────────────────────────────────
  '1':  { game:'shooter',  code:'1234', title:'ALPHA-01', diff:1, coreHp:6,   walls:4,  time:70 },
  '2':  { game:'shooter',  code:'2847', title:'ALPHA-02', diff:1, coreHp:6,   walls:5,  time:65 },
  '3':  { game:'sequence', code:'3391', title:'ALPHA-03', diff:1, sequences:3, baseLen:4, timePerSeq:50 },
  '4':  { game:'sequence', code:'4056', title:'ALPHA-04', diff:1, sequences:3, baseLen:4, timePerSeq:55 },
  '5':  { game:'nodes',    code:'5512', title:'ALPHA-05', diff:1, puzzles:1,  time:60 },
  '6':  { game:'shooter',  code:'6723', title:'ALPHA-06', diff:1, coreHp:7,   walls:4,  time:65 },
  '7':  { game:'nodes',    code:'7834', title:'ALPHA-07', diff:1, puzzles:1,  time:55 },
  '8':  { game:'sequence', code:'8190', title:'ALPHA-08', diff:1, sequences:4, baseLen:4, timePerSeq:50 },
  '9':  { game:'shooter',  code:'9201', title:'ALPHA-09', diff:1, coreHp:7,   walls:5,  time:60 },
  '10': { game:'sequence', code:'1047', title:'ALPHA-10', diff:1, sequences:3, baseLen:5, timePerSeq:50 },

  // ── בינוני ───────────────────────────────────────────
  '11': { game:'shooter',  code:'1138', title:'BETA-11',  diff:2, coreHp:10,  walls:7,  time:50 },
  '12': { game:'sequence', code:'1223', title:'BETA-12',  diff:2, sequences:5, baseLen:5, timePerSeq:40 },
  '13': { game:'nodes',    code:'1309', title:'BETA-13',  diff:2, puzzles:2,  time:45 },
  '14': { game:'shooter',  code:'1414', title:'BETA-14',  diff:2, coreHp:11,  walls:8,  time:45 },
  '15': { game:'sequence', code:'1556', title:'BETA-15',  diff:2, sequences:5, baseLen:6, timePerSeq:38 },
  '16': { game:'nodes',    code:'1667', title:'BETA-16',  diff:2, puzzles:2,  time:42 },
  '17': { game:'shooter',  code:'1782', title:'BETA-17',  diff:2, coreHp:12,  walls:7,  time:48 },
  '18': { game:'sequence', code:'1893', title:'BETA-18',  diff:2, sequences:4, baseLen:6, timePerSeq:35 },
  '19': { game:'shooter',  code:'1934', title:'BETA-19',  diff:2, coreHp:10,  walls:8,  time:45 },
  '20': { game:'nodes',    code:'2045', title:'BETA-20',  diff:2, puzzles:2,  time:40 },

  // ── קשה ─────────────────────────────────────────────
  '21': { game:'shooter',  code:'2156', title:'GAMMA-21', diff:3, coreHp:18,  walls:12, time:40 },
  '22': { game:'sequence', code:'2267', title:'GAMMA-22', diff:3, sequences:6, baseLen:7, timePerSeq:30 },
  '23': { game:'nodes',    code:'2378', title:'GAMMA-23', diff:3, puzzles:3,  time:40 },
  '24': { game:'shooter',  code:'2489', title:'GAMMA-24', diff:3, coreHp:20,  walls:14, time:35 },
  '25': { game:'sequence', code:'2590', title:'GAMMA-25', diff:3, sequences:7, baseLen:7, timePerSeq:28 },
  '26': { game:'nodes',    code:'2601', title:'GAMMA-26', diff:3, puzzles:3,  time:35 },
  '27': { game:'shooter',  code:'2712', title:'GAMMA-27', diff:3, coreHp:22,  walls:12, time:38 },
  '28': { game:'sequence', code:'2823', title:'GAMMA-28', diff:3, sequences:6, baseLen:8, timePerSeq:25 },
  '29': { game:'shooter',  code:'2934', title:'GAMMA-29', diff:3, coreHp:25,  walls:14, time:32 },
  '30': { game:'nodes',    code:'3045', title:'GAMMA-30', diff:3, puzzles:3,  time:30 },
};

// ════════════════════════════════════════════════════════
//  קוד הניתוב — לא לגעת מכאן
// ════════════════════════════════════════════════════════
const GAME_FILES = { shooter: 'shooter.html', sequence: 'sequence.html', nodes: 'nodes.html' };

const params = new URLSearchParams(location.search);
const boxId  = params.get('box');
const cfg    = BOXES[boxId];

if (!cfg) {
  document.getElementById('status').style.display = 'none';
  document.getElementById('err').style.display    = 'block';
} else {
  const dest = GAME_FILES[cfg.game];
  const encoded = encodeURIComponent(JSON.stringify(cfg));
  document.getElementById('status').textContent = `ROUTING TO ${cfg.title}`;
  setTimeout(() => {
    location.replace(`${dest}?box=${boxId}&cfg=${encoded}`);
  }, 600);
}
</script>
</body>
</html>
