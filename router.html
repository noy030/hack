<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0d0b">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoRHa — Connecting...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  body{margin:0;background:#080806;color:#c8c2b5;font-family:'Share Tech Mono',monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;}
  .dot{animation:blink .6s step-end infinite;}.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{50%{opacity:0;}}
  #status{font-size:12px;letter-spacing:4px;color:#6a6458;margin-top:8px;}
  #err{color:#cc3300;font-size:13px;letter-spacing:3px;display:none;text-align:center;line-height:2;}
</style>
</head>
<body>
<div style="font-size:22px;letter-spacing:6px;">CONNECTING<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
<div id="status">INITIALIZING TACTICAL LINK</div>
<div id="err">BOX NOT FOUND<br><span style="font-size:11px;color:#6a6458">CHECK QR CODE AND TRY AGAIN</span></div>
<script src="boxes.js"></script>
<script>
// הגדרות התיבות נמצאות ב-boxes.js. ה-URL מכיל רק את מספר התיבה — שום קוד.
(function () {
  var m = /[?&]box=([^&#]*)/.exec(location.search);
  var boxId = m ? decodeURIComponent(m[1]) : null;
  var cfg = boxId && BOXES[boxId];
  if (!cfg) {
    document.getElementById('status').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    return;
  }
  // the key printed in this box's QR decrypts this box's code — keep it on the phone, out of the URL
  var km = /[?&]k=([^&#]*)/.exec(location.search);
  if (km) { try { localStorage.setItem('htb_k_' + boxId, decodeURIComponent(km[1])); } catch (e) {} }
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js')['catch'](function () {}); } catch (e) {} }
  document.getElementById('status').textContent = 'ROUTING TO ' + cfg.title;
  setTimeout(function () {
    location.replace(GAME_FILES[cfg.game] + '?box=' + encodeURIComponent(boxId));
  }, 500);
})();
</script>
</body>
</html>
