<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoRHa — Connecting...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  body{margin:0;background:#080806;color:#c8c2b5;font-family:'Share Tech Mono',monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;}
  .dot{animation:blink .6s step-end infinite;}.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{50%{opacity:0;}}
  #status{font-size:12px;letter-spacing:4px;color:#6a6458;margin-top:8px;}
  #err{color:#cc3300;font-size:13px;letter-spacing:3px;display:none;text-align:center;line-height:2;}
</style>
</head>
<body>
<div style="font-size:22px;letter-spacing:6px;">CONNECTING<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
<div id="status">INITIALIZING TACTICAL LINK</div>
<div id="err">BOX NOT FOUND<br><span style="font-size:11px;color:#6a6458">CHECK QR CODE AND TRY AGAIN</span></div>
<script>
// ═══════════════════════════════════════════════════════════════════
//  הגדרות תיבות — ערוך כאן בלבד
//  game:     'shooter' | 'sequence' | 'blocks'
//  diff:     1=קל  2=בינוני  3=קשה
//
//  SHOOTER — שדות נוספים:
//    coreHp   — נקודות חיים של הגרעין
//    walls    — מספר חומות
//    time     — זמן בשניות
//    fireMode — 'aimed' | 'spiral' | 'burst' | 'random' | 'ring' | 'tracking'
//    wallMode — 'orbit' | 'static' | 'expand' | 'zigzag'
//
//  SEQUENCE — שדות נוספים:
//    sequences   — כמה רצפים לעבור
//    baseLen     — אורך רצף ראשון
//    timePerSeq  — זמן לכל רצף
//    showSpeed   — מהירות הצגה: 'slow'|'normal'|'fast'
//    nodeCount   — כמה כפתורים גלויים: 4|7|10
//    noise       — האם יש הסחות דעת: true|false
//
//  BLOCKS — שדות נוספים:
//    puzzleSet   — 'easy'|'medium'|'hard'  (קובע את סט הפאזלים)
//    time        — זמן לכל פאזל
//    puzzles     — כמה פאזלים לעבור (1-3)
// ═══════════════════════════════════════════════════════════════════

const BOXES = {
  // ── קל ──────────────────────────────────────────────────────────
  '1':  { game:'shooter',  code:'1234', title:'ALPHA-01', diff:1, coreHp:6,  walls:4, time:70, fireMode:'aimed',    wallMode:'orbit'  },
  '2':  { game:'shooter',  code:'2847', title:'ALPHA-02', diff:1, coreHp:6,  walls:5, time:65, fireMode:'random',   wallMode:'static' },
  '3':  { game:'shooter',  code:'3391', title:'ALPHA-03', diff:1, coreHp:7,  walls:4, time:65, fireMode:'burst',    wallMode:'orbit'  },
  '4':  { game:'sequence', code:'4056', title:'ALPHA-04', diff:1, sequences:2, baseLen:4, timePerSeq:55, showSpeed:'slow',   nodeCount:4,  noise:false },
  '5':  { game:'sequence', code:'5512', title:'ALPHA-05', diff:1, sequences:2, baseLen:4, timePerSeq:50, showSpeed:'normal', nodeCount:7,  noise:false },
  '6':  { game:'blocks',   code:'6723', title:'ALPHA-06', diff:1, puzzleSet:'easy',   time:70, puzzles:1 },
  '7':  { game:'blocks',   code:'7834', title:'ALPHA-07', diff:1, puzzleSet:'easy',   time:65, puzzles:1 },
  '8':  { game:'shooter',  code:'8190', title:'ALPHA-08', diff:1, coreHp:7,  walls:5, time:60, fireMode:'spiral',   wallMode:'static' },
  '9':  { game:'sequence', code:'9201', title:'ALPHA-09', diff:1, sequences:2, baseLen:4, timePerSeq:50, showSpeed:'slow',   nodeCount:4,  noise:false },
  '10': { game:'blocks',   code:'1047', title:'ALPHA-10', diff:1, puzzleSet:'easy',   time:60, puzzles:2 },

  // ── בינוני ─────────────────────────────────────────────────────
  '11': { game:'shooter',  code:'1138', title:'BETA-11',  diff:2, coreHp:11, walls:7, time:50, fireMode:'aimed',    wallMode:'orbit'   },
  '12': { game:'shooter',  code:'1223', title:'BETA-12',  diff:2, coreHp:10, walls:8, time:48, fireMode:'burst',    wallMode:'expand'  },
  '13': { game:'shooter',  code:'1309', title:'BETA-13',  diff:2, coreHp:12, walls:7, time:45, fireMode:'spiral',   wallMode:'zigzag'  },
  '14': { game:'sequence', code:'1414', title:'BETA-14',  diff:2, sequences:3, baseLen:5, timePerSeq:40, showSpeed:'normal', nodeCount:7,  noise:false },
  '15': { game:'sequence', code:'1556', title:'BETA-15',  diff:2, sequences:3, baseLen:6, timePerSeq:38, showSpeed:'fast',   nodeCount:7,  noise:true  },
  '16': { game:'sequence', code:'1667', title:'BETA-16',  diff:2, sequences:3, baseLen:5, timePerSeq:40, showSpeed:'normal', nodeCount:10, noise:false },
  '17': { game:'blocks',   code:'1782', title:'BETA-17',  diff:2, puzzleSet:'medium', time:50, puzzles:1 },
  '18': { game:'blocks',   code:'1893', title:'BETA-18',  diff:2, puzzleSet:'medium', time:45, puzzles:2 },
  '19': { game:'shooter',  code:'1934', title:'BETA-19',  diff:2, coreHp:10, walls:8, time:48, fireMode:'ring',     wallMode:'orbit'   },
  '20': { game:'blocks',   code:'2045', title:'BETA-20',  diff:2, puzzleSet:'medium', time:48, puzzles:2 },

  // ── קשה ───────────────────────────────────────────────────────
  '21': { game:'shooter',  code:'2156', title:'GAMMA-21', diff:3, coreHp:20, walls:12,time:38, fireMode:'tracking', wallMode:'expand'  },
  '22': { game:'shooter',  code:'2267', title:'GAMMA-22', diff:3, coreHp:18, walls:12,time:40, fireMode:'spiral',   wallMode:'zigzag'  },
  '23': { game:'shooter',  code:'2378', title:'GAMMA-23', diff:3, coreHp:22, walls:14,time:35, fireMode:'ring',     wallMode:'expand'  },
  '24': { game:'sequence', code:'2489', title:'GAMMA-24', diff:3, sequences:3, baseLen:7, timePerSeq:28, showSpeed:'fast',   nodeCount:10, noise:true  },
  '25': { game:'sequence', code:'2590', title:'GAMMA-25', diff:3, sequences:3, baseLen:7, timePerSeq:25, showSpeed:'fast',   nodeCount:10, noise:true  },
  '26': { game:'sequence', code:'2601', title:'GAMMA-26', diff:3, sequences:3, baseLen:8, timePerSeq:30, showSpeed:'fast',   nodeCount:7,  noise:true  },
  '27': { game:'blocks',   code:'2712', title:'GAMMA-27', diff:3, puzzleSet:'hard', time:40, puzzles:1 },
  '28': { game:'blocks',   code:'2823', title:'GAMMA-28', diff:3, puzzleSet:'hard', time:38, puzzles:2 },
  '29': { game:'shooter',  code:'2934', title:'GAMMA-29', diff:3, coreHp:25, walls:14,time:32, fireMode:'burst',    wallMode:'zigzag'  },
  '30': { game:'blocks',   code:'3045', title:'GAMMA-30', diff:3, puzzleSet:'hard', time:35, puzzles:3 },
};

const GAME_FILES = { shooter:'shooter.html', sequence:'sequence.html', blocks:'nodes.html' };

const params = new URLSearchParams(location.search);
const boxId  = params.get('box');
const cfg    = BOXES[boxId];

if (!cfg) {
  document.getElementById('status').style.display = 'none';
  document.getElementById('err').style.display    = 'block';
} else {
  document.getElementById('status').textContent = `ROUTING TO ${cfg.title}`;
  setTimeout(() => {
    location.replace(`${GAME_FILES[cfg.game]}?box=${boxId}&cfg=${encodeURIComponent(JSON.stringify(cfg))}`);
  }, 500);
}
</script>
</body>
</html>
